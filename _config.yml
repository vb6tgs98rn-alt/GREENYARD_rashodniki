# Настройки публикации сайта на GitHub Pages (Jekyll, legacy build).
#
# exclude — файлы и папки, которые НЕ попадают в опубликованный сайт.
# Без этого списка GitHub Pages раздаёт весь репозиторий как статику, включая
# исходники edge-функций и SQL-схему БД. Фронтенд их не использует: он грузит
# только index.html, styles.css и модули из корня, а к серверу обращается
# по абсолютным URL вида https://<project>.supabase.co/functions/v1/...
#
# ВАЖНО: при добавлении новой серверной папки — сразу дописать её сюда.
exclude:
  - supabase        # исходный код edge-функций (Deno/TypeScript) и миграции
  - sql             # SQL-скрипты и схема базы данных
  - DEPLOY.md       # внутренняя инструкция по развёртыванию интеграций
  - package.json    # служебные файлы, браузеру не нужны
  - package-lock.json
  - vercel.json
